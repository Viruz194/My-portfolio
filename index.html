<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOUSHIK_TS // NEURAL_LINK_V3.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap');

        :root {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-overlay: rgba(0, 0, 0, 0.95);
            --text-primary: #e0e0e0;
            --text-secondary: #999999;
            --text-muted: #555555;
            --accent-yellow: #fcee0a; /* Cyberpunk Yellow */
            --accent-cyan: #00f3ff;
            --accent-pink: #ff003c;
            --border-dim: #333333;
            --shadow-glow: #fcee0a;
            --grid-color: rgba(0, 243, 255, 0.05);
        }

        .minimal-theme {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-overlay: rgba(255, 255, 255, 0.98);
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent-yellow: #ca8a04;
            --accent-cyan: #2563eb;
            --accent-pink: #dc2626;
            --border-dim: #e2e8f0;
            --shadow-glow: #2563eb;
            --grid-color: rgba(37, 99, 235, 0.04);
        }

        /* Custom Keyframes */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        @keyframes scan-fast {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        @keyframes scan-horizontal {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100vw); }
        }

        @keyframes border-glow {
            0%, 100% {
                border-color: var(--accent-cyan);
                box-shadow: 0 0 5px var(--accent-cyan);
            }
            50% {
                border-color: var(--accent-cyan);
                box-shadow: 0 0 20px var(--accent-cyan), inset 0 0 10px var(--accent-cyan);
            }
        }

        .animate-glitch {
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
        }

        .animate-scan-fast {
            animation: scan-fast 4s linear infinite;
        }

        .animate-scan-slow {
            animation: scan-horizontal 10s linear infinite;
        }

        .animate-scan-vertical {
            animation: scan-fast 8s linear infinite;
        }

        .animate-border-glow {
            animation: border-glow 2s ease-in-out infinite;
        }

        .scanlines {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* Cyberpunk angled clip path */
        .clip-corner {
            clip-path: polygon(
                0 0, 
                100% 0, 
                100% calc(100% - 20px), 
                calc(100% - 20px) 100%, 
                0 100%
            );
        }
        
        .clip-corner-top-right {
             clip-path: polygon(
                0 0, 
                calc(100% - 20px) 0,
                100% 20px,
                100% 100%, 
                0 100%
            );
        }

        .cyber-grid {
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
            pointer-events: none;
        }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* Selection color */
        ::selection {
            background: var(--accent-yellow);
            color: #000;
        }
        .clip-polygon-btn {
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .clip-polygon-card {
            clip-path: polygon(0 0, calc(100% - 25px) 0, 100% 25px, 100% 100%, 25px 100%, 0 calc(100% - 25px));
        }

        /* Custom Cyber Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-cyan);
            border-radius: 0px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-yellow);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--accent-cyan);
        }

        @keyframes pulse-once {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pulse-once {
            animation: pulse-once 0.3s cubic-bezier(0, 0, 0.2, 1);
        }
    </style>
